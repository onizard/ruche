<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>La Ruche des enfants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne étroite posée sur une feuille Seyès (marge rouge, lignes bleues),
   les cartes sont des fiches bristol blanches, l'accent est le jaune miel du « Spelling Bee ». */
:root{
  --paper:#F7F9FD;
  --line:rgba(70,110,190,.10);
  --line-strong:rgba(70,110,190,.22);
  --margin:rgba(214,84,96,.45);
  --card:#FFFFFF;
  --ink:#1D2333;
  --ink-soft:#586079;
  --border:#D5DBE7;
  --honey:#F2B415;
  --honey-ink:#7A5400;
  --honey-pale:#FFF3CF;
  --on-honey:#1D2333;
  --fr:#2F5DB8;
  --fr-pale:#E5ECFA;
  --en:#B83A45;
  --en-pale:#FBE6E8;
  --ok:#23804F;
  --ok-pale:#DDF2E5;
  --bad:#C23B30;
  --bad-pale:#FBE3E0;
  --shadow:0 1px 0 rgba(29,35,51,.06), 0 6px 18px -8px rgba(29,35,51,.25);
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131722; --line:rgba(120,150,220,.07); --line-strong:rgba(120,150,220,.14);
    --margin:rgba(230,110,120,.35); --card:#1D2230; --ink:#ECEFF6; --ink-soft:#A2AAC0;
    --border:#30384A; --honey:#F5C33B; --honey-ink:#F5C33B; --honey-pale:#3A3115; --on-honey:#1D2333;
    --fr:#8DB0F5; --fr-pale:#22304D; --en:#F2939B; --en-pale:#43242A;
    --ok:#62CB8F; --ok-pale:#173B28; --bad:#F2857A; --bad-pale:#45201D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131722; --line:rgba(120,150,220,.07); --line-strong:rgba(120,150,220,.14);
  --margin:rgba(230,110,120,.35); --card:#1D2230; --ink:#ECEFF6; --ink-soft:#A2AAC0;
  --border:#30384A; --honey:#F5C33B; --honey-ink:#F5C33B; --honey-pale:#3A3115; --on-honey:#1D2333;
  --fr:#8DB0F5; --fr-pale:#22304D; --en:#F2939B; --en-pale:#43242A;
  --ok:#62CB8F; --ok-pale:#173B28; --bad:#F2857A; --bad-pale:#45201D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--line-strong) 31px 32px),
    repeating-linear-gradient(180deg, transparent 0 7px, var(--line) 7px 8px);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.5;
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
@media (min-width:700px){ .wrap{padding-inline:24px} }
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--fr);outline-offset:2px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink-soft);font-size:.9rem}
.iconbtn{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--ink-soft)}

/* Blocs de réglages */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.seg button{border:2px solid var(--border);background:transparent;border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.seg button b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.seg button .sub{font-size:.8rem;color:var(--ink-soft);line-height:1.25}
.seg button[aria-pressed="true"]{border-color:var(--honey);background:var(--honey-pale)}
.seg.small button{padding:8px 6px}
.dir{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.tag.fr{background:var(--fr-pale);color:var(--fr)}
.tag.en{background:var(--en-pale);color:var(--en)}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.chip{border:2px solid var(--border);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.chip[aria-pressed="true"]{border-color:var(--honey);background:var(--honey-pale)}
.chip .n{font-weight:700;line-height:1.2}
.chip .meta{font-size:.78rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--honey);border-radius:99px;transition:width .4s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.link{background:none;border:0;padding:0;color:var(--fr);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}

.go{background:var(--honey);color:var(--on-honey);border:0;border-radius:14px;padding:16px 20px;font-family:var(--f-display);font-weight:600;font-size:1.25rem;box-shadow:0 3px 0 var(--honey-ink);width:100%}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--honey-ink)}
.go:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px 16px;font-weight:700}
.ghost:hover{border-color:var(--ink-soft)}
.hint{font-size:.85rem;color:var(--ink-soft);margin:0}

/* Séance */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:10px}
.prog span{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.stage{perspective:1400px}
.flash{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:8px}
.face.fr::before{background:var(--fr)}
.face.en::before{background:var(--en)}
.face.back{transform:rotateY(180deg)}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.note{color:var(--ink-soft);font-size:.9rem;margin:0}
.tap{position:absolute;bottom:12px;font-size:.8rem;color:var(--ink-soft)}
.speak{border:1px solid var(--border);background:var(--card);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;color:var(--en)}
.speak:hover{border-color:var(--en)}
.prompt{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;overflow:hidden}
.prompt::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--fr)}
.prompt.en::before{background:var(--en)}
.prompt.dict::before{background:var(--honey)}
.answer{display:flex;flex-direction:column;gap:10px}
.answer input{width:100%;font-family:var(--f-body);font-size:1.4rem;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--ink);text-align:center;letter-spacing:.02em}
.answer input:focus{border-color:var(--fr);outline:none}
.answer input.ok{border-color:var(--ok);background:var(--ok-pale)}
.answer input.bad{border-color:var(--bad);background:var(--bad-pale)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}
.b-ok{background:var(--ok);color:var(--card);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.b-bad{background:var(--bad);color:var(--card);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-pale);color:var(--ink)}
.feedback.bad{background:var(--bad-pale);color:var(--ink)}
.feedback h3{font-size:1.15rem}
.feedback.ok h3{color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.spell{font-family:var(--f-body);font-size:1.35rem;letter-spacing:.06em;font-weight:700;overflow-wrap:anywhere}
.spell .x{background:var(--bad);color:var(--card);border-radius:4px;padding:0 2px}
.spell .g{background:var(--ok);color:var(--card);border-radius:4px;padding:0 2px}
.spell .gap{display:inline-block;min-width:.6em;border-bottom:3px solid var(--ok)}
.spell s{text-decoration-thickness:2px}
.small{font-size:.85rem;color:var(--ink-soft)}
.dictbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big-listen{background:var(--honey);color:var(--on-honey);border:0;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:600;font-size:1.2rem;display:inline-flex;gap:10px;align-items:center;box-shadow:0 3px 0 var(--honey-ink)}

/* Cartes question / réponse (maths, SVT…) */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 20px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--fr)}
.qcard.svt::before{background:var(--ok)}
.qcard.histoire::before{background:var(--honey)}
.qcard.pc::before{background:var(--en)}
.qcard.mytho::before{background:linear-gradient(90deg,var(--fr) 0 50%,var(--card) 50% 100%);background-size:24px 8px}
.qcard.mytho{border-color:var(--fr)}
.pic{align-self:center;width:min(240px,70%);height:auto;aspect-ratio:1;border-radius:18px;border:3px solid var(--fr);object-fit:cover;background:var(--fr-pale)}
.statue{margin:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.statue img{width:min(200px,60%);height:auto;aspect-ratio:1;border-radius:14px;object-fit:cover}
.statue figcaption{font-size:.8rem;color:var(--ink-soft)}
.heword{font-family:"Arial Hebrew","Noto Sans Hebrew","Segoe UI",system-ui,sans-serif;font-size:clamp(1.9rem,8vw,2.6rem);font-weight:700;line-height:1.25;color:var(--ink);text-align:center;direction:rtl;overflow-wrap:anywhere}
.translit{text-align:center;font-style:italic;color:var(--ink-soft);font-size:1.05rem}
.herow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qcard.hebreu::before{background:linear-gradient(180deg,var(--fr) 0 3px,var(--card) 3px 5px,var(--fr) 5px 8px)}
.tbl td.he{direction:rtl;text-align:right;font-weight:700;font-size:1.05rem}
.tbl td.he small{display:block;direction:ltr;text-align:right;font-weight:400;font-style:italic;color:var(--ink-soft);font-size:.8rem}
.medal{align-self:center;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:58px;line-height:1;background:var(--fr-pale);border:3px solid var(--fr);box-shadow:inset 0 0 0 6px var(--card)}
.qcard.bonus::before{background:linear-gradient(90deg,var(--en),var(--honey),var(--ok),var(--fr))}
#subjects button.is-locked{opacity:.45;filter:grayscale(1);border-style:dashed}
#subjects button.is-locked[aria-pressed="true"]{opacity:.7}
#subjects button.is-ready{border-color:var(--honey);background:var(--honey-pale);animation:glow 1.8s ease-in-out infinite}
#subjects button.is-ready b{color:var(--honey-ink)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,180,21,.0)}50%{box-shadow:0 0 0 5px rgba(242,180,21,.35)}}
@media (prefers-reduced-motion: reduce){#subjects button.is-ready{animation:none}}
.tally{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tally span{border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:.85rem;color:var(--ink-soft)}
.tally span b{color:var(--ink);font-variant-numeric:tabular-nums}
.tally span.has{border-color:var(--honey)}
.tally span.full{border-color:var(--ok);background:var(--ok-pale)}
.tally span.full b{color:var(--ok)}
.lock{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.lock h2{font-size:1.3rem}
.lock .bar{width:100%;height:12px}
.lock b.n{font-family:var(--f-display);font-size:2.2rem;font-variant-numeric:tabular-nums;line-height:1}
#subjects{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
#subjects button{padding-inline:4px}

.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(1.2rem,4.6vw,1.5rem);line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.qans{border-top:2px dashed var(--border);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.atext{font-size:1.1rem;line-height:1.55;overflow-wrap:anywhere}
.atext b{color:var(--en)}
.tag.q{background:var(--fr-pale);color:var(--fr);align-self:flex-start}
.tag.a{background:var(--ok-pale);color:var(--ok);align-self:flex-start}
.tbl td.ans{font-size:.92rem}
.tbl td.ans b{color:var(--en)}

/* Résultats */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mist li{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:center}
.mist li span{min-width:0;overflow-wrap:anywhere}
.mist .e{font-weight:700;color:var(--en)}
.mist .f{color:var(--fr)}

/* Liste */
.list h2{font-size:1.25rem;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td{padding:8px 6px;border-top:1px solid var(--border);vertical-align:middle}
.tbl td.f{color:var(--ink-soft);width:45%}
.tbl td.e{font-weight:700}
.tbl td.s{width:36px;text-align:right}
.tbl .speak{width:32px;height:32px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--border);vertical-align:middle}
.dot.l1,.dot.l2{background:var(--honey)}
.dot.l3,.dot.l4,.dot.l5{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft)}
.danger{color:var(--bad);border-color:var(--bad-pale)}
footer{font-size:.8rem;color:var(--ink-soft);text-align:center}

@media (max-width:420px){
  .seg button .sub{display:none}
  .brand h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){
  .flash{transition:none}
  .bar i{transition:none}
}
</style>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="22" cy="20" rx="11" ry="8" fill="var(--fr-pale)" stroke="var(--fr)" stroke-width="2" transform="rotate(-25 22 20)"/>
        <ellipse cx="40" cy="18" rx="11" ry="8" fill="var(--fr-pale)" stroke="var(--fr)" stroke-width="2" transform="rotate(25 40 18)"/>
        <ellipse cx="32" cy="38" rx="18" ry="15" fill="var(--honey)"/>
        <path d="M24 25.5v25M32 23v30M40 25.5v25" stroke="var(--ink)" stroke-width="4.5"/>
        <circle cx="47" cy="34" r="2.3" fill="var(--ink)"/>
      </svg>
      <div>
        <h1>La Ruche des enfants</h1>
        <p>Flashcards de 6e · toutes les matières</p>
      </div>
    </div>
    <button class="iconbtn" id="homeBtn" hidden>Accueil</button>
  </header>
  <main id="view"></main>
  <footer>Les progrès sont gardés sur cet appareil.</footer>
</div>

<script>
/* ===== Vocabulaire =====
   Une ligne = français | anglais | variantes acceptées (séparées par ;) | remarque
   Les articles (a, an, the, to) sont facultatifs quand on écrit, mais s'ils sont écrits ils doivent être justes. */
const THEMES = [
{id:'classe', nom:'En classe', sous:'Consignes et phrases du cours', data:`
faire l'appel | to take the register | to take a register
souligner | to underline
entourer | to circle
surligner | to highlight
distribuer | to hand out
poser (quelque chose) | to put down
jeter | to throw
saluer | to greet
suivre | to follow
épeler | to spell
Qui est absent aujourd'hui ? | Who is absent today?
absent (qui manque) | missing
Personne n'est absent aujourd'hui. | Nobody is missing today.
il y a (+ pluriel) | there are
beaucoup de, plusieurs | many
des élèves | pupils | students
Qui peut m'aider, s'il vous plaît ? | Who can help me, please?
Comment dit-on … en anglais ? | How do you say ... in English? | | « English » prend toujours une majuscule.
Que veut dire … ? | What does ... mean?
Peux-tu épeler … ? | Can you spell ...?
le contraire | the opposite
le pluriel | the plural
les devoirs | homework | | Pas de « s » : homework est invariable.
Quelle est la date aujourd'hui ? | What is the date today?
la dernière leçon | the last lesson
une virgule | a comma
une majuscule | a capital letter
facile | easy
comme (facile comme ABC) | as
un mot transparent | a transparent word
un concours d'orthographe | a spelling bee
`},
{id:'saluer', nom:'Se saluer', sous:'Greetings', data:`
bonjour (le matin) | good morning
bonjour (l'après-midi) | good afternoon
bonsoir | good evening
bonjour, salut | hello | hi
Comment vas-tu aujourd'hui ? | How are you today?
Nous sommes contents de te voir ! | We are happy to see you!
Dis bonjour à la classe ! | Say hello to the class!
fier, fière | proud
`},
{id:'meteo', nom:'La météo', sous:'What is the weather like?', data:`
la météo, le temps | the weather
Quel temps fait-il aujourd'hui ? | What is the weather like today?
ensoleillé | sunny
nuageux | cloudy
venteux (il y a du vent) | windy
pluvieux | rainy
neigeux (il neige) | snowy
orageux | stormy
froid | cold
doux, tiède | warm
chaud | hot
le soleil | the sun
la lune | the moon
une goutte de pluie | a raindrop
des gouttes de pluie | raindrops
un arc-en-ciel | a rainbow
le tonnerre | thunder
`},
{id:'emotions', nom:'Les émotions', sous:'How are you today? I feel…', data:`
nerveux, stressé | nervous
perdu, qui ne comprend pas | confused
fatigué | tired
qui a sommeil | sleepy
amoureux | in love
malade | sick | ill
bête, idiot | silly
heureux, content | happy
en colère | angry
triste | sad
fier, fière | proud
surexcité, très impatient | excited
Je me sens… | I feel ...
`},
{id:'jours', nom:'Jours & saisons', sous:'Days of the week', data:`

const QA_THEMES = [
{id:'m-s1-nombres', subject:'maths', nom:'Séq. 1 · Nombres entiers', sous:'Chiffres, millions, milliards', data:`
À quoi servent les nombres entiers naturels ? | À **compter** des objets, des personnes… à donner une **quantité**.
Donne trois exemples d'entiers naturels. | Par exemple **2, 90, 307**.
Quelle différence entre un chiffre et un nombre ? | Il n'y a que **10 chiffres** (de 0 à 9). Ils servent à **écrire tous les nombres**.
Combien vaut un milliard ? | **Mille millions**, soit **1 000 000 000**.
Dans 1 023 456 789, quel est le chiffre des dizaines de millions ? | **2**.
Dans 1 023 456 789, quel est le chiffre des centaines de milliers ? | **4**.
Comment écrire 1023456789 pour qu'il soit lisible ? | **1 023 456 789** : on laisse un **espace tous les 3 chiffres** en partant de la droite.
Décompose 4 507 avec des multiplications. | **4 × 1 000 + 5 × 100 + 0 × 10 + 7 × 1**.
`},
{id:'m-s1-ortho', subject:'maths', nom:'Séq. 1 · Écrire les nombres', sous:'Million, vingt, cent, mille', data:`
Million et milliard prennent-ils un S au pluriel ? Pourquoi ? | **Oui**, car ce sont des **noms** : trois million**s**.
Quand « vingt » et « cent » prennent-ils un S ? | Quand ils sont **multipliés** et **ne sont suivis d'aucun autre nombre** : quatre-vingt**s**, deux-cent**s**. ¶ Mais : quatre-vingt-trois, deux-cent-dix.
« Mille » prend-il un S ? | **Jamais**, il est **invariable**.
Écris 3 500 en lettres. | **trois-mille-cinq-cents** (avec un **s** à cents).
`},
{id:'m-s1-comparer', subject:'maths', nom:'Séq. 1 · Comparer, encadrer', sous:'Ordre, symboles, ordre de grandeur', data:`
Que veut dire comparer deux nombres ? | Dire lequel est **le plus grand**, **le plus petit**, ou s'ils sont **égaux**.
Qu'est-ce que l'ordre croissant ? | Du **plus petit au plus grand**.
Range 45, 12, 100, 50 dans l'ordre décroissant. | **100 > 50 > 45 > 12**.
Que signifient les symboles < et > ? | **<** : « est strictement **inférieur** à ». ¶ **>** : « est strictement **supérieur** à ».
Que signifie le symbole ≈ ? | « **Environ égal** à ».
Qu'est-ce qu'encadrer un nombre ? | Donner un nombre **plus petit** et un nombre **plus grand** que lui.
Encadre 5 678 901 au millier près. | **5 678 000 < 5 678 901 < 5 679 000**.
Qu'est-ce qu'un ordre de grandeur d'un nombre ? | Une **valeur simple et proche** de ce nombre.
Donne un ordre de grandeur de 22 135 467 891 au million près. | **22 135 000 000**. ¶ On note 22 135 467 891 **≈** 22 135 000 000.
`},
{id:'m-s2-droites', subject:'maths', nom:'Séq. 2 · Points et droites', sous:'Géométrie plane', data:`
Qu'est-ce qu'un point ? Comment le représente-t-on ? | Le **plus petit élément du plan**, **sans longueur ni largeur**. On le représente par une **croix**.
Combien de droites passent par deux points distincts ? | **Une seule** (une unique droite).
Combien de droites passent par un seul point ? | **Une infinité**.
Comment peut-on nommer la droite qui passe par A et B ? | **(AB)** ou **(BA)**, ou **(d)** si on lui donne un nom.
Dans la droite (xy), x et y sont-ils des points ? | **Non**, ce sont des **directions**.
Comment appelle-t-on le point où plusieurs droites se croisent ? | Le **point d'intersection**.
Trois points H, D, F sont alignés. Comment nommer la droite ? | **(HD)**, **(DF)** ou **(HF)** : c'est la même droite.
`},
{id:'m-s2-alignes', subject:'maths', nom:'Séq. 2 · Demi-droites, alignement', sous:'[Ax), ∈ et ∉', data:`
Que fait un point A placé sur une droite (xy) ? | Il partage la droite en **deux demi-droites** : **[Ax)** et **[Ay)**.
Comment note-t-on la demi-droite d'origine A qui part vers x ? | **[Ax)** : **crochet** du côté de A, **parenthèse** du côté de x.
Quand dit-on que des points sont alignés ? | Quand ils **appartiennent à une même droite**.
Deux points sont-ils toujours alignés ? | **Oui, toujours**.
Que signifient les symboles ∈ et ∉ ? | **∈** : « **appartient à** ». ¶ **∉** : « **n'appartient pas à** ».
Le point C est sur la droite (DE). Comment l'écrire ? | **C ∈ (DE)**. On a aussi D ∈ (CE) et E ∈ (CD).
Le point G n'est pas sur la droite (FH). Comment l'écrire ? | **G ∉ (FH)**. On a aussi F ∉ (GH) et H ∉ (FG).
`},
{id:'m-s2-segments', subject:'maths', nom:'Séq. 2 · Segments et milieu', sous:'[AB], AB, codage', data:`
Qu'est-ce que le segment [AB] ? | La **portion de la droite (AB)** **délimitée par les points A et B**. On le note avec des **crochets** : [AB] ou [BA].
Quelle différence entre (AB), [AB] et AB ? | **(AB)** est la **droite**. ¶ **[AB]** est le **segment**. ¶ **AB** est la **longueur** du segment.
Qu'est-ce que la longueur d'un segment ? | La **distance entre ses extrémités**, c'est-à-dire le **plus court chemin** entre les 2 points.
Qu'est-ce que le milieu d'un segment ? | Le point du segment situé **à égale distance de ses extrémités**.
Si I est le milieu de [AB], donne les 3 égalités. | **AI = IB** ¶ **AB = 2 × AI** ¶ **AI = AB ÷ 2**
À quoi sert le codage (les petits traits) ? | À montrer que **deux longueurs sont égales**.
`},
{id:'m-s2-perimetre', subject:'maths', nom:'Séq. 2 · Périmètre', sous:'Contour, formules', data:`
Qu'est-ce que le périmètre d'une figure ? | La **longueur de son contour**.
Comment calcule-t-on le périmètre d'un polygone ? | On **additionne les longueurs de ses côtés**, toutes exprimées dans la **même unité**.
Formule du périmètre du carré ? | **P = 4 × c**
Formule du périmètre du rectangle ? | **P = 2 × (L + l)**
Formule du périmètre du losange ? | **P = 4 × c**
Formule du périmètre d'un pentagone régulier ? | **P = 5 × c**
ABCD a pour côtés 1,3 ; 2,3 ; 2,8 et 1,5 cm. Son périmètre ? | P = AB + BC + CD + DA = 1,3 + 2,3 + 2,8 + 1,5 = **7,9 cm**.
Périmètre d'un losange de côté 3,6 cm ? | P = 4 × 3,6 = **14,4 cm**.
`},
{id:'m-s2-paralleles', subject:'maths', nom:'Séq. 2 · Parallèles, perpendiculaires', sous:'Propriétés « cœur »', data:`
Quand deux droites sont-elles parallèles ? | Quand elles **ne se coupent pas**. On note **(d1) // (d2)**.
Quand deux droites sont-elles sécantes ? | Quand elles ont **un seul point d'intersection**.
Quand deux droites sont-elles perpendiculaires ? | Quand elles se coupent en formant un **angle droit**. On note **(d1) ⊥ (d2)**.
Propriété ❤ des droites perpendiculaires ? | Si deux droites sont **perpendiculaires à une même droite**, alors elles sont **parallèles**.
Propriété ❤ des droites parallèles ? | Si deux droites sont **parallèles**, toute droite **perpendiculaire à l'une** est **perpendiculaire à l'autre**.
(d1) ⊥ (Δ) et (d2) ⊥ (Δ). Prouve que (d1) // (d2). | **On sait que** (d1) ⊥ (Δ) et (d2) ⊥ (Δ). ¶ **Propriété :** si deux droites sont perpendiculaires à une même droite, alors elles sont parallèles. ¶ **Donc** (d1) // (d2).
(d1) // (d2) et (d1) ⊥ (Δ). Prouve que (Δ) ⊥ (d2). | **On sait que** (d1) // (d2) et (d1) ⊥ (Δ). ¶ **Propriété :** si deux droites sont parallèles, toute droite perpendiculaire à l'une est perpendiculaire à l'autre. ¶ **Donc** (Δ) ⊥ (d2).
Comment se lit le symbole Δ ? | **Delta**.
`},
{id:'m-s3-decimaux', subject:'maths', nom:'Séq. 3 · Nombres décimaux', sous:'Début du chapitre', data:`
Qu'est-ce qu'une fraction décimale ? | Une fraction dont le **dénominateur** est **1, 10, 100, 1 000…**
Comment lit-on 7/10 ? Et 35/100 ? | **Sept dixièmes**. ¶ **Trente-cinq centièmes**.
4/7 est-elle une fraction décimale ? | **Non**, car son dénominateur est **7**.
Qu'est-ce qu'un nombre décimal ? | Un nombre qui **peut s'écrire sous forme de fraction décimale**.
Donne les écritures de 35/4. | Décimale : **8,75** ¶ Fraction décimale : **875/100** ¶ Écriture mixte : **8 + 75/100**
Décompose 65 430,1. | **6 × 10 000 + 5 × 1 000 + 4 × 100 + 3 × 10 + 0,1**
Décompose 2,978 avec des fractions. | **2 + 9/10 + 7/100 + 8/1000**
Écris 2,978 avec sa partie entière et sa partie décimale. | **2 + 0,978**
Qu'est-ce qu'une demi-droite graduée d'origine O ? | Une demi-droite sur laquelle on choisit une **unité** que l'on **reporte régulièrement à partir de l'origine**.
Qu'est-ce que l'abscisse d'un point ? | Le **nombre** qui **repère ce point** sur une demi-droite graduée.
`},
{id:'m-s3-comparer', subject:'maths', nom:'Séq. 3 · Comparer et ranger', sous:'Décimaux, <, >, =', data:`
Que veut dire comparer deux nombres décimaux ? | Dire lequel est **le plus grand**, **le plus petit**, ou s'ils sont **égaux**.
Compare 9,3 et 5,8. | **9,3 > 5,8** : 9,3 est **supérieur** à 5,8.
Compare 37,1 et 194,8. | **37,1 < 194,8** : 37,1 est **inférieur** à 194,8.
0,73900 et 0,739 sont-ils égaux ? | **Oui** : **0,73900 = 0,739**. Les zéros à la fin de la partie décimale ne changent rien.
Que veut dire ranger dans l'ordre croissant ? | Ranger **du plus petit au plus grand**.
Que veut dire ranger dans l'ordre décroissant ? | Ranger **du plus grand au plus petit**.
Range dans l'ordre croissant : 5,8 ; 3,9 ; 94,3 ; 2,1 ; 105,6 ; 3,84. | **2,1 < 3,84 < 3,9 < 5,8 < 94,3 < 105,6**
Lequel est le plus grand : 3,9 ou 3,84 ? | **3,9**, car 3,9 = 3,90 et **90 centièmes > 84 centièmes**.
`},
{id:'m-s3-encadrer', subject:'maths', nom:'Séq. 3 · Encadrer et intercaler', sous:"À l'unité, au dixième, au centième", data:`
Qu'est-ce qu'encadrer un nombre décimal ? | L'écrire **entre un nombre plus petit que lui** et **un autre plus grand**.
Que sont deux entiers consécutifs ? | Deux entiers **qui se suivent**, comme 78 et 79.
Encadre 78,637 à l'unité. | **78 < 78,637 < 79** (écart : 79 − 78 = **1**)
Encadre 78,637 au dixième. | **78,6 < 78,637 < 78,7** (écart : **0,1**)
Encadre 78,637 au centième. | **78,63 < 78,637 < 78,64** (écart : **0,01**)
Comment lit-on 78 < 78,637 < 79 ? | « 78,637 est **compris entre** 78 et 79 ».
Qu'est-ce qu'intercaler un nombre entre deux nombres ? | **Trouver un nombre compris entre** ces deux nombres.
Intercale un nombre entre 72,5 et 72,6. | Par exemple **72,54** : 72,5 < 72,54 < 72,6.
Combien de nombres peut-on intercaler entre 72,5 et 72,6 ? | **Une infinité** ! Par exemple 72,512 ou 72,5899.

{id:'m-s3-arrondir', subject:'maths', nom:'Séq. 3 · Arrondir', sous:"À l'unité, au dixième", data:`
Pour arrondir à l'unité, quel chiffre regarde-t-on ? | Le **chiffre des dixièmes**.
Pour arrondir à l'unité, quand arrondit-on à l'unité inférieure ? | Quand le chiffre des dixièmes est **0, 1, 2, 3 ou 4**.
Pour arrondir à l'unité, quand arrondit-on à l'unité supérieure ? | Quand le chiffre des dixièmes est **5, 6, 7, 8 ou 9**.

{id:'m-s5-addition', subject:'maths', nom:'Séq. 5 · Addition des décimaux', sous:'Somme, termes, propriétés', data:`
Qu'est-ce que l'addition ? | L'opération qui fait correspondre à deux nombres a et b **leur somme a + b**.
Comment s'appellent a et b dans la somme a + b ? | Les **termes** de la somme.
Comment s'écrit la somme de 5 et de 6 ? | **5 + 6**, qui est égale à **11**.
Que veut dire « l'addition est commutative » ? | On peut **changer l'ordre des termes** : **a + b = b + a**. ¶ Ex. : 10 + 6 = 6 + 10 = 16.
Que veut dire « l'addition est associative » ? | On peut **regrouper les termes** comme on veut : **(a + b) + c = a + (b + c) = a + b + c**.
Vérifie que (10 + 6) + 7 = 6 + (10 + 7). | (10 + 6) + 7 = 16 + 7 = **23** et 6 + (10 + 7) = 6 + 17 = **23**.
Calcule astucieusement 18,4 + 13 + 1,6 + 47. | On regroupe : **(18,4 + 1,6) + (13 + 47) = 20 + 60 = 80**.
Que vaut a + 0 ? | **a + 0 = 0 + a = a**. Ex. : 5 + 0 = 0 + 5 = 5.
Comment appelle-t-on 0 dans l'addition ? | L'**élément neutre** de l'addition.
`},
{id:'s-conditions', subject:'svt', nom:'Les conditions de la vie', sous:'La Terre, planète habitée', data:`
Quelles planètes du système solaire sont gazeuses ? | **Jupiter, Saturne, Uranus et Neptune** : elles n'ont **pas de sol**.
Qu'est-ce qu'une planète tellurique ? Cite-les. | Une planète **solide**, faite de **roches**, avec un **sol** : **Mercure, Vénus, la Terre et Mars**.
Quel est le principal constituant des êtres vivants ? | **L'eau** (liquide) : 93 % du champignon, 94 % de la mousse, 74 % de la mésange.
Par quoi commence toujours une hypothèse ? | **« Je pense que… »** ou **« Je suppose que… »**.
Comment varie la température quand on s'éloigne du Soleil ? | Elle **diminue** : plus on est **proche du Soleil**, plus il fait **chaud**.
Quelle est la seule planète où l'on trouve de l'eau liquide ? | **La Terre**.
Quelles sont les 3 conditions de la Terre qui permettent la vie ? | 1) Une **bonne distance au Soleil**, donc une **bonne température**. ¶ 2) De l'**eau à l'état liquide**, indispensable à la vie. ¶ 3) Une **atmosphère** riche en **dioxygène**, avec la **couche d'ozone**.
En quoi l'atmosphère favorise-t-elle la vie ? | Elle maintient une **température propice** à la vie et **filtre les rayonnements dangereux** du Soleil.
`},
{id:'s-serre', subject:'svt', nom:"L'effet de serre", sous:'GES, 15 °C, −18 °C', data:`
Qu'est-ce que l'effet de serre ? | Un **phénomène naturel** qui **retient une partie de la chaleur** renvoyée par la Terre. Il maintient la température moyenne à **15 °C**.
Quelle serait la température sans effet de serre ? | **−18 °C** (moins dix-huit degrés).
Qu'est-ce qu'un gaz à effet de serre (GES) ? | Un **gaz de l'atmosphère** qui **absorbe et réémet** le **rayonnement infrarouge** (la chaleur) renvoyé par la Terre.
Cite 3 gaz à effet de serre. | Le **dioxyde de carbone** (CO₂), la **vapeur d'eau**, le **méthane** (CH₄).
Explique l'effet de serre en 4 étapes. | 1) Le **Soleil chauffe** la surface de la Terre. ¶ 2) La Terre émet des **infrarouges** (chaleur). ¶ 3) Les **GES absorbent** une partie de ces infrarouges. ¶ 4) L'atmosphère réchauffée **renvoie de la chaleur** vers la Terre.
`},
{id:'s-rechauffement', subject:'svt', nom:'Le réchauffement climatique', sous:'Preuves, causes, solutions', data:`
Qu'est-ce qu'un climatosceptique ? | Une personne qui **ne « croit » pas** au réchauffement climatique.
Que pensent les climatologues ? | **97 %** sont d'accord sur l'**origine humaine** du réchauffement.
Qu'est-ce que le GIEC ? | Le **groupe d'experts** qui étudie les **variations du climat** et leurs conséquences.
Comment a évolué la température en France entre 1975 et 2020 ? | Elle est passée de 12 °C à 14 °C : elle a **augmenté de 2 °C**.
Comment rédige-t-on la lecture d'un document ? | **« Je vois que… »** (ce que je lis), puis **« Je déduis que… »** (ce que j'en conclus).
Le réchauffement est-il dû uniquement à des causes naturelles ? | **Non**. Les **activités humaines** (transports, énergie, électricité, déchets) rejettent des **GES** comme le CO₂ et le CH₄.
Cite des conséquences du réchauffement climatique. | Des **incendies**, la **disparition des sapins**, le **blanchissement des coraux** : les **écosystèmes sont détruits**.
Que peut-on faire pour le limiter ? | **Replanter des arbres** (la forêt **absorbe le CO₂** et protège les sols de l'**érosion**), prendre les **transports en commun**, **recycler**.
`},
{id:'s-ecosystemes', subject:'svt', nom:'Les écosystèmes', sous:'Forêt, réseau alimentaire', data:`
Qu'est-ce qu'un écosystème ? | Un ensemble formé par les **êtres vivants**, leur **milieu de vie**, et les **interactions** des êtres vivants entre eux et avec leur milieu.
Qu'est-ce qu'un paramètre ? Donne un exemple. | Une **grandeur que l'on peut mesurer**, par exemple la **température** (ou l'humidité, le vent, la luminosité).
Compare la forêt (milieu fermé) et la prairie (milieu ouvert). | La forêt est beaucoup plus **sombre** (luminosité 0 à 200 contre 1 800), **moins venteuse**, plus **humide** et un peu plus **fraîche**.
Qu'est-ce qu'un réseau alimentaire ? | Plusieurs **chaînes alimentaires reliées** entre elles.
Que veut dire la flèche dans un réseau alimentaire ? | **« Est mangé par »**. Elle va de celui qui est mangé vers celui qui mange.
Donne une chaîne alimentaire de la forêt. | **Hêtre** (feuilles) → **bombyx** (chenilles) → **mésange** → **épervier**.
Qu'est-ce que les serres ? | Des **doigts prolongés de longues griffes** qui s'enfoncent dans la proie.
Comment l'épervier est-il adapté à la chasse en forêt ? | Il a des **ailes courtes**, de **longues pattes** et des **serres**.
Pourquoi le peuplement d'un écosystème n'est-il pas dû au hasard ? | Les êtres vivants vivent là où le **milieu leur convient**. Ex. : le pied-de-mouton ne pousse qu'en milieu **humide et sombre** ; la mésange niche dans un trou creusé par le **pic épeiche**.
Qui mange la mésange ? | **L'épervier** (et la martre).
Que mange le chevreuil ? | **Les feuilles du hêtre**.
Qui mange les larves du capricorne ? | **Le pic épeiche**.
`},
{id:'h-c1-intro', subject:'histoire', nom:'Ch. 1 · Connaître la Préhistoire', sous:'Définition, archéologues', data:`
Qu'est-ce que la Préhistoire ? | La période **la plus ancienne** de l'histoire de l'humanité : de l'**apparition des premiers hommes** à l'**invention de l'écriture**.
Quand commence la Préhistoire ? | Avec l'apparition des premiers hommes **en Afrique**, il y a environ **2,5 millions d'années**.
Quand se termine la Préhistoire ? | Avec l'**invention de l'écriture**, vers **3 300 av. J.-C.**
Grâce à qui connaît-on la Préhistoire ? | Grâce aux **fouilles archéologiques** et aux découvertes des **archéologues**.
Quels outils utilisent les archéologues ? | Des outils **précis et fragiles** : **petites pelles, pinceaux, truelles, tamis**…
Pourquoi les archéologues creusent-ils couche par couche ? | Car **chaque niveau du sol** correspond à **une époque différente**.
Que font les archéologues de chaque objet découvert ? | Il est **noté, photographié et dessiné**. Rien n'est déplacé sans être **enregistré**.
Qu'est-ce qu'un fossile ? | Une **trace de vie**, animale ou végétale, **préservée dans la roche**.
Pourquoi date-t-on les fossiles et les vestiges ? | Pour connaître leur **âge**, mais aussi **comment les hommes vivaient**, ce qu'ils **mangeaient**, leurs **croyances**.
Comment date-t-on les vestiges en laboratoire ? | Par des analyses : **carbone 14**, **ADN**, datation par la pierre ou les sédiments.
`},
{id:'h-c1-especes', subject:'histoire', nom:"Ch. 1 · L'évolution humaine", sous:'Toumaï, Lucy, Homo…', data:`
Quel est l'hominidé connu le plus ancien ? | **Toumaï**, un *Sahelanthropus tchadensis*.
Qui est Lucy ? | Un **australopithèque** : un ancien primate qui a vécu il y a environ **3,5 à 2,5 millions d'années**.
Qui marche debout mais ne fabrique pas d'outils ? | **Lucy** (et Toumaï).
Quelle espèce maîtrise le feu et quitte l'Afrique ? | **Homo erectus**.
Quelle est notre espèce actuelle ? | **Homo sapiens**.
Que sait faire Homo sapiens ? | Il utilise des **outils perfectionnés** et se répand sur **tous les continents**.
Pourquoi surnomme-t-on l'Afrique « le berceau de l'humanité » ? | Parce que les **premiers hominidés** y sont **apparus**.
Qu'est-ce qu'un hominidé ? | Une espèce de la **famille de l'Homme et de ses ancêtres**.
Que montre l'évolution humaine ? | Une **progression** de la **posture**, de la **taille** et des **capacités techniques et culturelles**.
Range dans l'ordre d'apparition : Homo erectus, Toumaï, Homo sapiens, Lucy, Homo habilis. | **Toumaï → Lucy → Homo habilis → Homo erectus → Homo sapiens**. | | Complément (frise) : Toumaï vers 7 millions d'années, Homo habilis vers 2,5 millions, Homo erectus vers 2 millions, Homo sapiens vers 300 000 ans.
`},
{id:'h-c1-innovations', subject:'histoire', nom:'Ch. 1 · Le feu et les outils', sous:'Innovations techniques', data:`
Quand l'homme a-t-il maîtrisé le feu ? Quelle espèce ? | Il y a environ **400 000 ans**, par **Homo erectus**.
À quoi servait le feu ? | À **cuire** les aliments, se **réchauffer**, se **protéger** des animaux sauvages et **éclairer** les grottes.
Depuis quand l'homme fabrique-t-il des outils en pierre taillée ? | Depuis environ **2,5 millions d'années**.
À quoi servaient les outils en pierre taillée ? | À **couper**, **gratter**, **dépecer** des animaux et **fabriquer d'autres outils**.
Pourquoi ces innovations sont-elles essentielles ? | Elles ont facilité la **survie** et l'**adaptation** des hommes. Grâce au feu, ils ont pu aller dans des **régions plus froides**.
`},
{id:'h-c1-mots', subject:'histoire', nom:'Ch. 1 · Mots et dates', sous:'Vocabulaire à connaître', data:`
Qu'est-ce qu'un archéologue ? | Un **scientifique** qui étudie le passé grâce aux **vestiges** retrouvés lors de **fouilles**.
Qu'est-ce qu'un vestige ? | **Ce qui reste d'une époque passée** : outil, os, poterie, peinture…
Que s'est-il passé vers 2,5 millions d'années ? | Les **premiers hommes** en Afrique et les **premiers outils en pierre taillée** : **début de la Préhistoire**.
Que s'est-il passé vers 400 000 ans ? | La **maîtrise du feu** par Homo erectus.
Que s'est-il passé vers 3 300 av. J.-C. ? | L'**invention de l'écriture** : **fin de la Préhistoire**.
`},
{id:'pc-c1-matiere', subject:'pc', nom:'Ch. 1 · La matière', sous:'Familles, propriétés', data:`
Où trouve-t-on de la matière ? | **Partout** et sous diverses formes. Elle peut être **vivante ou inerte**, **naturelle ou fabriquée** par l'Homme.
Cite les 5 familles de matière. | Les **métaux**, les **plastiques**, le **verre**, la **matière minérale** et la **matière organique**.
Donne des exemples de métaux. | Le **fer**, l'**aluminium**, le **cuivre**…
Donne des exemples de matière minérale. | La **roche**, le **sable**, le **sel**…
Donne des exemples de matière organique. | Le **bois**, une **feuille**, le **coton**…
Cite des propriétés physico-chimiques d'un échantillon de matière. | **Masse, volume, conductivité électrique, conductivité thermique, densité, élasticité, magnétisme, couleur, solubilité, miscibilité**.
Cite des caractéristiques d'un échantillon de matière. | Sa **forme**, si c'est un matériau **brut ou transformé**, son **origine** (minerai…).
`},
{id:'pc-c1-densite', subject:'pc', nom:'Ch. 1 · La densité', sous:'Flotte ou coule ?', data:`
Comment calcule-t-on la densité d'un solide par rapport à l'eau ? | **d = masse d'un volume de solide ÷ masse du même volume d'eau**
À volume égal, quel objet est le plus dense ? | **Le plus lourd** : plus un objet est lourd, plus il est dense.
Quelle est la densité de l'eau ? | **1**.
Un objet coule dans l'eau. Que dire de sa densité ? | Sa densité est **supérieure à 1**.
Un objet flotte sur l'eau. Que dire de sa densité ? | Sa densité est **inférieure à 1**.
Le bois et le polystyrène flottent ou coulent ? | Ils **flottent** : densité **inférieure à 1**.
Un caillou et un boulon en fer flottent ou coulent ? | Ils **coulent** : densité **supérieure à 1**.
`},
{id:'pc-c1-aimant', subject:'pc', nom:'Ch. 1 · Le magnétisme', sous:"L'aimant", data:`
Comment savoir si un matériau est magnétique ? | On passe un **aimant** au-dessus. S'il est **attiré**, il est **magnétique**.
Parmi le fer, le bois et le plastique, lequel est magnétique ? | **Le fer** : c'est le seul attiré par l'aimant.
Le bois et le plastique sont-ils attirés par l'aimant ? | **Non**, ils ne sont **pas magnétiques**.
`},
{id:'pc-c1-thermique', subject:'pc', nom:'Ch. 1 · La conductivité thermique', sous:'Le glaçon qui fond', data:`
Que veut dire « conduire la chaleur » ? | Certains matériaux **transmettent mieux la chaleur** que d'autres.
Sur quel matériau un glaçon fond-il le plus vite ? | Sur l'**aluminium**, car c'est un **bon conducteur thermique**.
Pourquoi le glaçon fond-il vite sur l'aluminium ? | L'aluminium **transmet très bien la chaleur de l'air** vers le glaçon, ce qui **accélère sa fonte**.
Qu'est-ce qu'un isolant thermique ? Donne 2 exemples. | Un matériau qui **conduit mal la chaleur** : le **bois** et le **polystyrène**. Le glaçon y fond **lentement**.
Range du plus isolant au meilleur conducteur : carrelage, aluminium, polystyrène, bois. | **Polystyrène, bois** (isolants) → **carrelage** (assez conducteur) → **aluminium** (bon conducteur).
`},

Qui est la déesse de la magie, qui éclaire les carrefours avec ses torches ? | **Hécate**. | 🔮;hecate
Qui est la déesse de la nuit, avec son grand voile étoilé ? | **Nyx**. | 🌙;nyx
`},
{id:'my-monstres', subject:'mytho', nom:'Monstres et créatures', sous:'Méduse, Pégase, centaures…', data:`
Quelle créature a des serpents à la place des cheveux ? | **Méduse**. Son regard **transforme en pierre** ceux qui la regardent. | 🐍;meduse
Quel monstre a une tête de taureau et un corps d'homme ? | Le **Minotaure**. | 🐂;minotaure
Où vit le Minotaure ? | Dans le **labyrinthe** du roi Minos, en **Crète**. | 🌀;minotaure
Qui est Cerbère ? | Le **chien à trois têtes** qui garde l'entrée des **Enfers**. | 🐕;cerbere
Quel monstre a des têtes qui repoussent quand on les coupe ? | L'**Hydre de Lerne**. | 🐉;hydre
Qu'est-ce qu'un cyclope ? | Un géant avec **un seul œil** au milieu du front. | 👁️;cyclope
Comment s'appelle le cyclope piégé par Ulysse ? | **Polyphème**. | 🪨;cyclope
Que font les sirènes ? | Elles **chantent** pour attirer les marins et faire couler leurs bateaux. | 🎶;sirenes
Comment s'appelle le cheval ailé ? | **Pégase**. Il est né du sang de Méduse. | 🐴;pegase
Quel monstre a une tête de lion, un corps de chèvre et une queue de serpent ? | La **Chimère**. Elle crache du **feu** ! | 🦁;chimere
Qu'est-ce qu'un centaure ? | Un être **moitié homme, moitié cheval**. | 🏇;centaure
Quel centaure très sage était le professeur des héros ? | **Chiron**. | 📜;centaure
Quelle créature pose une énigme aux voyageurs ? | Le **Sphinx**, avec un corps de lion et une tête de femme. | 🧩;sphinx
Quelle est l'énigme du Sphinx ? | « Qui marche à 4 pattes le matin, à 2 pattes à midi et à 3 pattes le soir ? » ¶ Réponse : **l'homme** (bébé, adulte, puis vieillard avec une canne). | 🤔;sphinx
Qu'est-ce que les Harpies ? | Des monstres **mi-femmes, mi-oiseaux** qui volent la nourriture. | 🦅;harpies
Combien de sœurs Gorgones y a-t-il ? | **Trois** : Méduse et ses deux sœurs **Sthéno** et **Euryale**. | 🐍;meduse
Qu'est-ce qu'une nymphe ? | Une **jeune divinité de la nature** qui vit dans les arbres, les rivières, les sources ou la mer. | 🌿
Comment s'appellent les nymphes des arbres ? | Les **dryades**. | 🌳
Comment s'appellent les nymphes de la mer ? | Les **néréides**. | 🌊
Qu'est-ce qu'un satyre ? | Un être des bois **mi-homme, mi-bouc**, qui adore la musique et la fête. | 🐐
Quel dieu des bergers a des pattes et des cornes de bouc ? | **Pan**, qui joue de la **flûte de Pan**. | 🪈;pan
Quel oiseau magique renaît de ses cendres ? | Le **phénix**. | 🔥;phenix
Qu'est-ce qu'un griffon ? | Une créature avec une **tête et des ailes d'aigle** et un **corps de lion**. | 🦅;griffon
Qu'est-ce qu'un hippocampe dans la mythologie ? | Un **cheval de mer** à queue de poisson qui tire le char de **Poséidon**. | 🐎;hippocampe
Qui sont les Muses ? | **Neuf sœurs**, filles de Zeus, qui inspirent les **arts**, la musique et la poésie. | 🎭
Quels monstres de la mer Ulysse doit-il éviter dans un détroit ? | **Charybde**, un tourbillon géant, et **Scylla**, un monstre à six têtes. | 🌀
Qui est Talos ? | Un **géant de bronze** qui protégeait la Crète en lançant des rochers. | 🗿
Quel est le monstre le plus terrible, que Zeus a dû combattre ? | **Typhon**, un géant aux cent têtes de serpent. | 🌪️
`},
{id:'my-heros', subject:'mytho', nom:'Les héros', sous:'Héraclès, Ulysse, Persée…', data:`
Quel héros très fort a accompli 12 travaux ? | **Héraclès** (Hercule chez les Romains), fils de Zeus. | 💪;heracles
Quel est le premier des 12 travaux d'Héraclès ? | Tuer le **lion de Némée**, dont il porte ensuite la peau. | 🦁;heracles
Qui a coupé la tête de Méduse ? | **Persée**. | 🗡️;persee
Comment Persée a-t-il vaincu Méduse sans être changé en pierre ? | Il l'a regardée dans le **reflet de son bouclier**. | 🛡️;persee
Qui a tué le Minotaure ? | **Thésée**. | 🐂;thesee
Comment Thésée est-il sorti du labyrinthe ? | Grâce au **fil d'Ariane**, la fille du roi Minos. | 🧶;thesee
Quel héros a mis 10 ans à rentrer chez lui après la guerre de Troie ? | **Ulysse**. Son voyage s'appelle l'**Odyssée**. | ⛵;ulysse
Quelle ruse a fait gagner la guerre de Troie ? | Le **cheval de Troie** : un grand cheval en bois rempli de soldats grecs. | 🐴;ulysse
Comment s'appellent l'île et la femme d'Ulysse ? | L'île d'**Ithaque** et sa femme **Pénélope**. | 🏝️;ulysse
Quel est le seul point faible d'Achille ? | Son **talon** : c'est le « talon d'Achille ». | 🦶;achille
Quel héros est parti chercher la Toison d'or ? | **Jason**, avec les **Argonautes** sur le navire **Argo**. | 🐏;jason
Pourquoi Icare est-il tombé ? | Il a volé **trop près du soleil** : la **cire** de ses ailes a fondu. | ☀️
Qui a fabriqué les ailes d'Icare ? | Son père **Dédale**, qui avait aussi construit le labyrinthe. | 🪶
Quel musicien est descendu aux Enfers chercher sa femme Eurydice ? | **Orphée**, avec sa **lyre**. | 🎵;orphee
Qui a volé le feu aux dieux pour le donner aux hommes ? | Le titan **Prométhée**. | 🔥;promethee
Qu'est-ce que la boîte de Pandore ? | Une boîte qui contenait **tous les malheurs** du monde. Pandore l'a ouverte ; seule l'**espérance** est restée au fond. | 📦
Quelle princesse, la plus belle du monde, a déclenché la guerre de Troie ? | **Hélène**. | 👑
Quel roi changeait tout ce qu'il touchait en or ? | Le roi **Midas**. | 🪙
Quelle chasseresse courait plus vite que tous les garçons ? | **Atalante**. | 🏃‍♀️;atalante
Quel héros a volé sur Pégase pour vaincre la Chimère ? | **Bellérophon**. | 🐴;bellerophon
Quel guerrier géant de la guerre de Troie avait un énorme bouclier ? | **Ajax**. | 🛡️;ajax
`},

  if (ok && byId[id] && !NO_POINTS.includes(byId[id].subject)) {

    const cy = cycle(), sub = byId[id].subject;

    const item = s.queue[s.i];
    if (!item.hd) { const d = store.prefs.hdir || 'fr-he'; item.hd = d === 'mix' ? (Math.random() < .5 ? 'fr-he' : 'he-fr') : d; }
    const heBlock = (big) => `<div class="herow"><div class="heword" lang="he">${esc(c.en)}</div>${canSpeak ? `<button type="button" class="speak" data-he="1" aria-label="Écouter en hébreu">${SPK}</button>` : ''}</div><div class="translit">${esc(c.alt[0] || '')}</div>`;
    const frBlock = `<div class="qtext" style="text-align:center">${esc(c.fr)}</div>`;
    const front = item.hd === 'fr-he' ? frBlock : heBlock();
    const back = item.hd === 'fr-he' ? heBlock() : frBlock;
    view.innerHTML = `<div class="wrap" style="padding:0">${progressHtml()}${ctx}
      <div class="qcard hebreu">
        <span class="tag q">${item.hd === 'fr-he' ? 'EN HÉBREU ?' : 'EN FRANÇAIS ?'}</span>
        ${front}
        <div class="qans" id="qans" hidden>
          <span class="tag a">RÉPONSE</span>
          ${back}
        </div>
      </div>
      ${canSpeak && !heVoice ? '<p class="hint" style="text-align:center">Pas de voix hébraïque sur cet appareil : installe « hébreu » dans les voix de synthèse vocale du téléphone.</p>' : ''}
      <button class="go" id="reveal" type="button">Voir la réponse</button>
      <div class="btns" id="judge" hidden>
        <button class="b-bad" id="no" type="button">Je ne savais pas</button>
        <button class="b-ok" id="yes" type="button">Je savais !</button>
      </div></div>`;
    view.querySelectorAll('[data-he]').forEach(b => b.onclick = () => sayHe(c.en));
    const reveal = view.querySelector('#reveal');
    reveal.onclick = () => { view.querySelector('#qans').hidden = false; view.querySelector('#judge').hidden = false; reveal.hidden = true; if (item.hd === 'fr-he') sayHe(c.en); view.querySelector('#yes').focus(); };
    view.querySelector('#yes').onclick = () => { answered(true); next(); };
    view.querySelector('#no').onclick = () => { answered(false); next(); };
    if (item.hd === 'he-fr') setTimeout(() => sayHe(c.en), 250);
    reveal.focus();
    return;
  }

  if (s.mode === 'qa') {
    view.innerHTML = `<div class="wrap" style="padding:0">${progressHtml()}${ctx}
      <div class="qcard ${c.subject}">
        <span class="tag q">QUESTION</span>
        ${c.alt[1] ? `<img class="pic" src="mytho/${esc(c.alt[1])}-dessin.jpg" alt="" width="440" height="440">` : c.alt[0] ? `<div class="medal" aria-hidden="true">${esc(c.alt[0])}</div>` : ''}
        <div class="qtext">${rich(c.fr)}</div>
        <div class="qans" id="qans" hidden>
          <span class="tag a">RÉPONSE</span>
          <div class="atext">${rich(c.en)}</div>
          ${c.alt[1] ? `<figure class="statue"><img src="mytho/${esc(c.alt[1])}-statue.jpg" alt="Statue" width="440" height="440" loading="lazy"><figcaption>Comme une statue de musée</figcaption></figure>` : ''}
          ${c.note ? `<p class="note">${rich(c.note)}</p>` : ''}
        </div>
      </div>
      <button class="go" id="reveal" type="button">Voir la réponse</button>
      <div class="btns" id="judge" hidden>
        <button class="b-bad" id="no" type="button">Je ne savais pas</button>
        <button class="b-ok" id="yes" type="button">Je savais !</button>
      </div></div>`;
    const reveal = view.querySelector('#reveal');
    reveal.onclick = () => { view.querySelector('#qans').hidden = false; view.querySelector('#judge').hidden = false; reveal.hidden = true; view.querySelector('#yes').focus(); };
    view.querySelector('#yes').onclick = () => { answered(true); next(); };
    view.querySelector('#no').onclick = () => { answered(false); next(); };
    reveal.focus();
    return;
  }

  if (s.mode === 'cartes') {
    const [front, back] = dir === 'fr-en' ? ['fr', 'en'] : ['en', 'fr'];
    view.innerHTML = `<div class="wrap" style="padding:0">${progressHtml()}${ctx}
      <div class="stage"><div class="flash" id="flash" tabindex="0" role="button" aria-label="Retourner la carte">
        <div class="face ${front}">${sideHtml(front, c)}<span class="tap">Touche la carte pour la retourner</span></div>
        <div class="face back ${back}">${sideHtml(back, c)}</div>
      </div></div>
      <div class="btns" id="judge" hidden>
        <button class="b-bad" id="no" type="button">Je ne savais pas</button>
        <button class="b-ok" id="yes" type="button">Je savais !</button>
      </div>
      <button class="ghost" id="flipBtn" type="button">Retourner la carte</button></div>`;
    const flash = view.querySelector('#flash'), judge = view.querySelector('#judge'), flipBtn = view.querySelector('#flipBtn');
    const flip = () => { flash.classList.toggle('flipped'); judge.hidden = false; flipBtn.hidden = true; if (flash.classList.contains('flipped') && back === 'en') say(c.en); };
    flash.onclick = e => { if (e.target.closest('[data-say]')) { e.stopPropagation(); say(c.en); return; } flip(); };
    flash.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    flipBtn.onclick = flip;
    view.querySelector('#yes').onclick = () => { answered(true); next(); };
    view.querySelector('#no').onclick = () => { answered(false); next(); };
    flipBtn.focus();
    return;
  }

  // Écrire / Dictée
  const target = dir === 'en-fr' ? 'fr' : 'en';
  let promptHtml;
  if (dir === 'dict') {
    promptHtml = `<div class="prompt dict"><span class="tag en">DICTÉE</span>
      <div class="dictbtn"><button class="big-listen" id="listen" type="button">${SPK} Écouter</button>
      <button class="ghost" id="slow" type="button">Plus lentement</button></div>
      <button class="link" id="clue" type="button">Indice : le sens en français</button>
      <p class="note" id="clueTxt" hidden>${esc(c.fr)}</p></div>`;
  } else {
    const src = dir === 'fr-en' ? 'fr' : 'en';
    promptHtml = `<div class="prompt ${src}">${sideHtml(src, c).replace(/<p class="note">.*?<\/p>/, '')}
      <p class="small" style="margin:0">Écris-le en ${target === 'en' ? 'anglais' : 'français'}</p></div>`;
  }
  view.innerHTML = `<div class="wrap" style="padding:0">${progressHtml()}${ctx}${promptHtml}
    <form class="answer" id="form" autocomplete="off">
      <input id="ans" ${target === 'en' ? 'lang="en"' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${target === 'en' ? 'in English…' : 'en français…'}" aria-label="Ta réponse">
      <div class="btns" id="actions"><button class="ghost" type="button" id="skip">Je ne sais pas</button><button class="go" type="submit" style="font-size:1.05rem;padding:12px">Vérifier</button></div>
    </form>
    <div id="fb"></div></div>`;
  const input = view.querySelector('#ans'), form = view.querySelector('#form'), fb = view.querySelector('#fb');
  if (dir === 'dict') {
    view.querySelector('#listen').onclick = () => { say(c.en); input.focus(); };
    view.querySelector('#slow').onclick = () => { say(c.en, true); input.focus(); };
    view.querySelector('#clue').onclick = e => { view.querySelector('#clueTxt').hidden = false; e.target.hidden = true; input.focus(); };
    setTimeout(() => say(c.en), 250);
  } else {
    const sp = view.querySelector('.prompt [data-say]');
    if (sp) sp.onclick = () => { say(c.en); input.focus(); };
  }
  input.focus();
  let done = false;
  const finish = (ok, html) => {
    done = true;
    input.readOnly = true;
    input.classList.add(ok ? 'ok' : 'bad');
    fb.innerHTML = html;
    view.querySelector('#actions').outerHTML = `<div class="btns one"><button class="go" type="submit" id="nextBtn" style="font-size:1.05rem;padding:12px">Suivant →</button></div>`;
    view.querySelector('#nextBtn').focus();
    const sp = fb.querySelector('[data-say]'); if (sp) sp.onclick = () => say(c.en);
    const over = fb.querySelector('#override');
    if (over) over.onclick = () => { session.first[c.id] = true; store.boxes[c.id] && (store.boxes[c.id].ko--, store.boxes[c.id].b = 0); record(c.id, true);
      // retire la répétition prévue
      const k = session.queue.findIndex((q, idx) => idx > session.i && q.c.id === c.id); if (k > -1) session.queue.splice(k, 1);
      next(); };
  };
  view.querySelector('#skip').onclick = () => {
    answered(false);
    finish(false, `<div class="feedback bad"><h3>Voici la réponse</h3>
      <div class="spell" ${target === 'en' ? 'lang="en"' : ''}>${esc(target === 'en' ? c.en : c.fr)}</div>
      ${c.note && target === 'en' ? `<p class="note">${esc(c.note)}</p>` : ''}
      ${target === 'en' && canSpeak ? `<div><button type="button" class="speak" data-say="1" aria-label="Écouter">${SPK}</button></div>` : ''}
      <p class="small" style="margin:0">Ce mot reviendra un peu plus loin.</p></div>`);
  };
  form.onsubmit = e => {
    e.preventDefault();
    if (done) return next();
    const val = input.value;
    if (!val.trim()) { input.focus(); return; }
    if (target === 'fr') {
      const ok = checkFr(val, c);
      answered(ok);
      finish(ok, ok
        ? `<div class="feedback ok"><h3>Bravo !</h3><div class="small">${esc(c.fr)}</div></div>`
        : `<div class="feedback bad"><h3>Pas tout à fait</h3>
            <div class="small">On attendait :</div><div class="spell">${esc(c.fr)}</div>
            <div><button class="link" type="button" id="override">J'avais trouvé, c'est juste dit autrement</button></div></div>`);
      return;
    }
    const r = checkEn(val, c);
    answered(r.ok);
    if (r.ok) {
      finish(true, `<div class="feedback ok"><h3>${['Perfect!', 'Well done!', 'Great!', 'Brilliant!'][Math.floor(Math.random() * 4)]}</h3>
        <div class="spell" lang="en">${esc(c.en)}</div>${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        ${dir !== 'dict' ? '' : `<div class="small">${esc(c.fr)}</div>`}</div>`);
      say(c.en);
    } else {
      const typed = norm(val);
      const close = r.caseOnly || levDist(typed.toLowerCase(), r.best.toLowerCase()) <= Math.max(2, Math.floor(r.best.length / 3));
      const d = diffHtml(typed, r.best, r.caseOnly);
      finish(false, `<div class="feedback bad"><h3>${r.caseOnly ? 'Attention à la majuscule !' : close ? 'Presque… regarde bien les lettres' : 'Pas tout à fait'}</h3>
        ${close ? `<div class="small">Tu as écrit :</div><div class="spell" lang="en">${d.mine}</div>
        <div class="small">La bonne orthographe :</div><div class="spell" lang="en">${d.good}</div>`
        : `<div class="small">La bonne réponse :</div><div class="spell" lang="en">${esc(c.en)}</div>`}
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        ${dir === 'dict' ? `<div class="small">Sens : ${esc(c.fr)}</div>` : ''}
        ${canSpeak ? `<div><button type="button" class="speak" data-say="1" aria-label="Écouter">${SPK}</button></div>` : ''}
        <p class="small" style="margin:0">Ce mot reviendra un peu plus loin.</p></div>`);
    }
  };
}

function results() {
  const s = session;
  if (s.mode === 'bonus') {
    view.innerHTML = `<div class="wrap" style="padding:0">
      <section class="panel lock">
        <span class="label">Fin du bonus</span>
        <h2>J'espère que tu t'es bien amusé(e) !</h2>
        <p class="hint">Le bonus est de nouveau verrouillé. Fais ${BONUS_GOAL} bonnes réponses dans les autres matières pour le débloquer encore.</p>
        <button class="go" id="back" type="button">Retour aux révisions</button>
      </section></div>`;
    view.querySelector('#back').onclick = () => { store.prefs.subject = 'maths'; save(); home(); };
    return;
  }
  const ids = Object.keys(s.first), good = ids.filter(id => s.first[id]).length;
  const wrong = ids.filter(id => !s.first[id]);
  const pct = ids.length ? good / ids.length : 0;
  const msg = pct === 1 ? 'Un sans-faute, bravo !' : pct >= .8 ? 'Très bien, encore un petit effort.' : pct >= .5 ? 'C\'est en bonne voie. On revoit les erreurs ?' : 'On s\'accroche : revois les erreurs, ça va venir.';
  view.innerHTML = `<div class="wrap" style="padding:0">
    <section class="panel">
      <span class="label">Résultat du premier coup</span>
      <div class="score"><b>${good}/${ids.length}</b><span>${msg}</span></div>
      <span class="bar" style="height:10px"><i style="width:${Math.round(pct * 100)}%"></i></span>
    </section>
    ${wrong.length ? `<section class="panel"><span class="label">À revoir (${wrong.length})</span>
      <ul class="mist">${wrong.map(id => { const c = byId[id]; return `<li><span class="f">${esc(plain(c.fr))}</span><span aria-hidden="true">→</span><span class="e" ${isQA(c.subject) ? '' : 'lang="en"'}>${isQA(c.subject) ? rich(c.en) : esc(c.en)}</span></li>`; }).join('')}</ul></section>` : ''}
    ${wrong.length ? `<button class="go" id="again">Revoir mes ${wrong.length} erreur${wrong.length > 1 ? 's' : ''}</button>` : ''}
    <div class="btns"><button class="ghost" id="new" type="button">Nouvelle série</button><button class="ghost" id="back" type="button">Accueil</button></div>
  </div>`;
  if (wrong.length) view.querySelector('#again').onclick = () => start(wrong);
  view.querySelector('#new').onclick = () => start();
  view.querySelector('#back').onclick = home;
}

function list() {
  homeBtn.hidden = false;
  view.innerHTML = `<div class="wrap" style="padding:0">
    <div class="legend"><span><i class="dot"></i>pas encore su</span><span><i class="dot l1"></i>en cours</span><span><i class="dot l3"></i>su</span></div>
    ${THEMES.filter(t => t.subject === store.prefs.subject).map(t => `<section class="panel list"><h2>${esc(t.nom)} <span class="small">· ${esc(t.sous)}</span></h2>
      <div style="overflow-x:auto"><table class="tbl"><tbody>${t.cards.map(c => c.subject === 'hebreu' ? `<tr><td class="f"><i class="dot l${boxOf(c.id)}"></i>${esc(c.fr)}</td><td class="he" lang="he">${esc(c.en)}<small>${esc(c.alt[0] || '')}</small></td><td class="s">${canSpeak ? `<button type="button" class="speak" data-hes="${esc(c.en)}" aria-label="Écouter">${SPK}</button>` : ''}</td></tr>` : isQA(c.subject) ? `<tr><td class="f"><i class="dot l${boxOf(c.id)}"></i>${c.alt[0] ? esc(c.alt[0]) + ' ' : ''}${esc(plain(c.fr))}</td><td class="ans">${rich(c.en)}</td></tr>` : `<tr><td class="f"><i class="dot l${boxOf(c.id)}"></i>${esc(c.fr)}</td><td class="e" lang="en">${esc(c.en)}</td><td class="s">${canSpeak ? `<button type="button" class="speak" data-en="${esc(c.en)}" aria-label="Écouter ${esc(c.en)}">${SPK}</button>` : ''}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}
    <section class="panel"><span class="label">Repartir de zéro</span>
      <p class="hint">Efface les progrès enregistrés sur cet appareil.</p>
      <div class="row"><button class="ghost danger" id="reset" type="button">Effacer les progrès</button></div></section>
    ${canSpeak ? `<p class="hint">Voix anglaise utilisée : ${voice ? esc(voice.name + ' · ' + voice.lang) : 'voix anglaise du système'}</p>` : ''}
  </div>`;
  view.querySelectorAll('[data-en]').forEach(b => b.onclick = () => say(b.dataset.en));
  view.querySelectorAll('[data-hes]').forEach(b => b.onclick = () => sayHe(b.dataset.hes));
  const reset = view.querySelector('#reset');
  reset.onclick = () => {
    if (reset.dataset.armed) { store.boxes = {}; save(); list(); return; }
    reset.dataset.armed = '1'; reset.textContent = 'Sûr ? Touche encore pour effacer';
  };
  window.scrollTo(0, 0);
}

if (canSpeak) { pickVoice(); pickHe(); speechSynthesis.onvoiceschanged = () => { pickVoice(); pickHe(); }; }
home();
</script>


</body>
